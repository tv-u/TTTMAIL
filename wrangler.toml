name = "tttmail-worker"
main = "worker.js"
compatibility_date = "2026-08-20"
workers_dev = true

[observability]
enabled = true

[vars]
MAIL_FROM = "TTTMAIL <no-reply@tttmail.dev>"
OTP_PEPPER = "change-this-in-production"
CRON_ENABLED = "1"

[[kv_namespaces]]
binding = "TTTMAIL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[triggers]
crons = ["0 * * * *", "*/30 * * * *"]
